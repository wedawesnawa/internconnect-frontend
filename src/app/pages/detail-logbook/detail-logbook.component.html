<div class="logbook-calendar">
  <full-calendar [options]="calendarOptions"></full-calendar>
</div>

<div id="dateModal" class="fixed inset-0 z-50 flex items-center justify-center hidden w-full h-full overflow-y-auto bg-gray-600 bg-opacity-50">
  <div class="relative w-full max-w-2xl bg-white rounded-lg shadow-lg">
    <div class="p-4">
      <h3 class="text-lg font-medium leading-6 text-gray-900">Create Event</h3>
      <p class="mt-2 text-sm text-gray-500">You clicked on: {{ selectedDate }}</p>

      <form class="my-6">
        <div class="mb-6">
           <label for="title" class="block mb-2 text-sm font-medium text-gray-900 ">Title</label>
           <input type="text" id="title" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5  dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Apple Keynote" required />
        </div>
        <div class="mb-6">
           <label for="description" class="block mb-2 text-sm font-medium text-gray-900 ">Description</label>
           <textarea id="description" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500  dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Write event description..."></textarea>
        </div>
        <div class="relative mb-6">
           <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                 <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
              </svg>
           </div>
           <input datepicker="" datepicker-autohide datepicker-buttons="" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5  dark:focus:ring-blue-500 dark:focus:border-blue-500 datepicker-input" placeholder="Select date">
        </div>
        <div class="mb-4">
           <label for="guests" class="mb-2 text-sm font-medium text-gray-900 sr-only ">Invite guests</label>
           <div class="relative">
              <input type="search" id="guests" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500  dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Add guest email" required />
              <button type="button" class="absolute inline-flex items-center px-3 py-1 text-sm font-medium text-white bg-blue-700 rounded-lg end-2 bottom-2 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"><svg class="w-3 h-3 me-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 18">
      <path d="M6.5 9a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9ZM8 10H5a5.006 5.006 0 0 0-5 5v2a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-2a5.006 5.006 0 0 0-5-5Zm11-3h-2V5a1 1 0 0 0-2 0v2h-2a1 1 0 1 0 0 2h2v2a1 1 0 0 0 2 0V9h2a1 1 0 1 0 0-2Z"/>
    </svg>Add</button>
           </div>
        </div>
     </form>

      <div class="flex justify-end mt-4">
        <button type="button" class="px-4 py-2 mr-2 text-gray-700 bg-gray-200 rounded-md" (click)="closeModal()">Cancel</button>
        <button type="button" class="px-4 py-2 text-white bg-indigo-600 rounded-md">Save</button>
      </div>
    </div>
  </div>
</div>
