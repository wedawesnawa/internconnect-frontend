<aside id="logo-sidebar" class="fixed top-0 left-0 z-20 w-64 h-screen pt-20 transition-transform -translate-x-full bg-white border-r border-gray-200 sm:translate-x-0" aria-label="Sidebar">
  <div class="h-full px-3 pb-4 overflow-y-auto bg-white">
    <ul class="space-y-2 text-base">
      <!-- Menu Items -->
      <li *ngFor="let menu of menuItems">
        <!-- Menu dengan children -->
        <div *ngIf="menu.children && menu.children.length > 0">
          <button
            (click)="toggleMenu(menu)"
            class="flex items-center w-full p-2 text-gray-900 rounded-lg hover:bg-gray-100 group"
            [class.bg-gray-100]="isActive(menu) || hasActiveChild(menu)">
            <svg class="flex-shrink-0 w-5 h-5 text-gray-500 transition duration-75 group-hover:text-gray-900" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
              <path [attr.d]="menu.icon"/>
            </svg>
            <span class="flex-1 text-left ms-3 whitespace-nowrap">{{ menu.label }}</span>
            <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="isActive(menu) || hasActiveChild(menu)" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>

          <!-- Sub Menu -->
          <ul *ngIf="isActive(menu) || hasActiveChild(menu)" class="py-1 space-y-1 ms-7">
            <li *ngFor="let child of menu.children">
              <a
                [routerLink]="child.path"
                routerLinkActive="bg-gray-100 text-blue-700"
                class="flex items-center p-2 text-sm text-gray-700 rounded-lg hover:bg-gray-100"
                [class.text-blue-700]="isChildActive(child)"
                [class.bg-gray-100]="isChildActive(child)">
                <span class="ms-2">{{ child.label }}</span>
                <span *ngIf="isChildActive(child)" class="ml-auto">
                  <svg class="w-3 h-3 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                  </svg>
                </span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Menu tanpa children -->
        <a
          *ngIf="!menu.children || menu.children.length === 0"
          [routerLink]="menu.path"
          routerLinkActive="bg-gray-100 text-blue-700"
          class="flex items-center p-2 text-gray-900 rounded-lg hover:bg-gray-100 group"
          [class.bg-gray-100]="isActive(menu)"
          [class.text-blue-700]="isActive(menu)">
          <svg class="flex-shrink-0 w-5 h-5 text-gray-500 transition duration-75 group-hover:text-gray-900" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
            <path [attr.d]="menu.icon"/>
          </svg>
          <span class="flex-1 ms-3 whitespace-nowrap">{{ menu.label }}</span>
          <span *ngIf="isActive(menu)" class="ml-auto">
            <svg class="w-3 h-3 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
          </span>
        </a>
      </li>
    </ul>
  </div>
</aside>
