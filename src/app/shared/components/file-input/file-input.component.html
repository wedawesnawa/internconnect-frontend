<div class="w-full">
  <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
    {{ label }} <span *ngIf="required" class="text-red-500">*</span>
  </label>

  <!-- Drop Zone -->
  <div
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    class="flex flex-col items-center justify-center w-full h-32 transition-colors border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 dark:bg-gray-700 dark:border-gray-600 dark:hover:border-gray-500 dark:hover:bg-gray-600"
    [class.border-blue-500]="isDragging"
    [class.bg-blue-50]="isDragging"
    [class.dark:bg-blue-900/20]="isDragging">

    <div class="flex flex-col items-center justify-center pt-5 pb-6">
      <svg class="w-8 h-8 mb-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
      </svg>
      <p class="mb-2 text-sm text-gray-500 dark:text-gray-400">
        <span class="font-semibold">Click to upload</span> or drag and drop
      </p>
      <p class="text-xs text-gray-500 dark:text-gray-400">
        Max size: {{ maxSize / 1024 / 1024 }}MB | Accept: {{ accept }}
      </p>
    </div>

    <input
      type="file"
      class="hidden"
      [accept]="accept"
      [multiple]="multiple"
      (change)="onFileSelected($event)" />
  </div>

  <!-- Error Message -->
  <p *ngIf="errorMessage" class="mt-2 text-sm text-red-600 dark:text-red-400">
    ⚠️ {{ errorMessage }}
  </p>

  <!-- File List -->
  <div *ngIf="files.length > 0" class="mt-3 space-y-2">
    <div *ngFor="let file of files; let i = index" class="flex items-center justify-between p-2 rounded-lg bg-gray-50 dark:bg-gray-700">
      <div class="flex items-center space-x-2">
        <span class="text-gray-600 dark:text-gray-300">{{ file.name }}</span>
        <span class="text-xs text-gray-400 dark:text-gray-500">({{ getFileSize(file.size) }})</span>
      </div>
      <button
        (click)="removeFile(i)"
        type="button"
        class="text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>
  </div>
</div>
