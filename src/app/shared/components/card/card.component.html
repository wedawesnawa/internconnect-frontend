<div [class]="cardClasses">
  <!-- Image at top -->
  <div *ngIf="showImage && imageUrl && imagePosition === 'top'" class="relative w-full h-40 overflow-hidden bg-gray-100">
    <img [src]="imageUrl" [alt]="imageAlt" class="object-cover w-full h-full">
    <ng-content select="[card-image-actions]"></ng-content>
  </div>

  <!-- Card Body -->
  <div class="p-4">
    <div *ngIf="title" class="mb-2">
      <h5 class="text-base font-bold tracking-tight text-gray-900 truncate" title="{{ title }}">
        {{ title }}
      </h5>
      <p *ngIf="subtitle" class="text-sm text-gray-500">
        {{ subtitle }}
      </p>
    </div>

    <ng-content></ng-content>
  </div>

  <!-- Image at bottom -->
  <div *ngIf="showImage && imageUrl && imagePosition === 'bottom'" class="relative w-full h-40 overflow-hidden">
    <img [src]="imageUrl" [alt]="imageAlt" class="object-cover w-full h-full">
    <ng-content select="[card-image-actions]"></ng-content>
  </div>
</div>
