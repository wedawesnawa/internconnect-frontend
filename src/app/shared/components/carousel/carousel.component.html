<div class="relative w-full h-64 overflow-hidden rounded-lg">
  <!-- Slides -->
  <div *ngFor="let image of images; let i = index"
       class="absolute inset-0 transition-opacity duration-500 ease-in-out"
       [class.opacity-0]="i !== currentIndex"
       [class.opacity-100]="i === currentIndex">
    <img [src]="image" class="object-cover w-full h-full" alt="Slide {{ i + 1 }}">
  </div>

  <!-- Controls -->
  <button *ngIf="showControls && images.length > 1"
          (click)="prev()"
          class="absolute p-2 text-gray-800 transition-all -translate-y-1/2 rounded-full shadow-lg left-4 top-1/2 bg-white/80 hover:bg-white hover:scale-110">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
    </svg>
  </button>

  <button *ngIf="showControls && images.length > 1"
          (click)="next()"
          class="absolute p-2 text-gray-800 transition-all -translate-y-1/2 rounded-full shadow-lg right-4 top-1/2 bg-white/80 hover:bg-white hover:scale-110">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
    </svg>
  </button>

  <!-- Indicators -->
  <div *ngIf="showIndicators && images.length > 1"
       class="absolute flex space-x-2 -translate-x-1/2 bottom-4 left-1/2">
    <button *ngFor="let image of images; let i = index"
            (click)="goTo(i)"
            class="w-2 h-2 transition-all rounded-full"
            [class.bg-white]="i === currentIndex"
            [class.bg-white/50]="i !== currentIndex"
            [class.w-4]="i === currentIndex">
    </button>
  </div>
</div>
